name: attention_cuda
seed_dir: seed
harness_dir: harness
score_entry: score.py
brief: |
  Optimize the CUDA attention forward kernel in this workspace.

  Interface (must not change): `attention_forward(q, k, v, causal)` exposed via
  pybind — q, k, v are contiguous BF16 CUDA tensors, q of shape [B, H, S, D]
  with D = 128, softmax scale 1/sqrt(D); returns BF16 [B, H, S, D]. Both causal
  and non-causal must be supported for arbitrary S. If the benchmark config
  sets kv_heads < heads (grouped-query attention), k and v arrive as
  [B, kv_heads, S, D] and each KV head serves heads/kv_heads consecutive query
  heads; with kv_heads == heads this reduces to standard MHA.

  Files: `attention.cu` (kernel + launcher) and `binding.cpp` (pybind module).
  You may add .cu/.cuh/.cpp/.h files; all are compiled together. Optionally
  create `build_flags.json` with {"extra_cuda_cflags": [...]} — allowed flags:
  -O0..-O3, --use_fast_math, -lineinfo, --maxrregcount=N, -Xptxas..., -D<name>[=v].

  You must IMPLEMENT the attention kernel yourself. Delegating to a pre-built
  fused attention op is forbidden and scores 0 — banned symbols include
  scaled_dot_product_attention, any cuDNN/flash-attn/xformers/mem-efficient
  attention entry point. Composing attention from GEMM primitives (cuBLAS,
  CUTLASS) is allowed; the point is that YOU write the attention algorithm.

  Scoring: source scan for banned APIs, compile, then numerical correctness
  versus an FP32 reference on randomized inputs (tolerance = 2x the intrinsic
  BF16 error floor + 1e-3; any failure scores 0), then TFLOPS benchmarked with
  CUDA events across a fixed grid of (seqlen, batch, causal) configs; score =
  geometric mean TFLOPS. FLOP convention: 4*B*H*S^2*D, halved for causal.

  The knowledge base has CUDA/arch tuning guides, online-softmax and
  FlashAttention algorithm notes, and PTX mma examples. FlashAttention-2/3 and
  CUTLASS/CuTe sources are present ONLY if fetched (run
  `python scripts/fetch_kb.py --from-manifest`); check knowledge_base/external/
  with kb_search before relying on them. The seed kernel is deliberately
  scalar — tensor cores, cp.async / TMA, better tiling, and softmax
  restructuring are all open.
