# Toy task: validates the full AVO loop locally, cheaply, with no GPU.
run_name: sort-py
task: tasks/sort_py
llm:
  provider: openai_compat
  model: deepseek-v4-flash
  base_url: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  max_tokens: 8192
  # deepseek-v4-flash, cache-miss rates (api-docs.deepseek.com, 2026-08);
  # conservative: cache hits are ~50x cheaper on input.
  price_input_per_mtok: 0.14
  price_output_per_mtok: 0.28
runner:
  kind: local
  eval_timeout_s: 300
task_params:
  sizes: [500, 2000, 8000]
budgets:
  max_versions: 5
  max_steps: 8
  max_wall_clock_s: 3600
  max_turns_per_step: 25
  max_evals_per_step: 6
  max_usd: 3.0
  # sized for deepseek-v4-flash rates: 3M tokens ~= $0.5-0.9 worst case
  max_total_tokens: 3000000
supervisor:
  stagnation_steps: 2
  min_rel_improvement: 0.01
  window: 3
