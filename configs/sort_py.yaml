# Toy task: validates the full AVO loop locally, cheaply, with no GPU.
run_name: sort-py
task: tasks/sort_py
llm:
  provider: anthropic
  model: claude-opus-5
  max_tokens: 8192
  # REQUIRED before a live run: fill from the provider's pricing page so the
  # max_usd cap can work. With prices at 0, only max_total_tokens protects you.
  price_input_per_mtok: 0.0
  price_output_per_mtok: 0.0
runner:
  kind: local
  eval_timeout_s: 300
task_params:
  sizes: [500, 2000, 8000]
budgets:
  max_versions: 5
  max_steps: 8
  max_wall_clock_s: 3600
  max_turns_per_step: 25
  max_evals_per_step: 6
  max_usd: 3.0
  max_total_tokens: 400000
supervisor:
  stagnation_steps: 2
  min_rel_improvement: 0.01
  window: 3
