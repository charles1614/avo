[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avo"
version = "0.1.0"
description = "Reproduction of AVO: Agentic Variation Operators for Autonomous Evolutionary Search (arXiv:2603.24517)"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "openai>=1.50",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
report = ["matplotlib>=3.8"]

[project.scripts]
avo = "avo.cli:main"

[tool.setuptools.packages.find]
include = ["avo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
